<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card w-100" style="max-width: 600px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
    <!-- Header -->
    <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white"
      style="border-radius: 12px 12px 0 0;">
      <h5 class="mb-0">Madeline</h5>
      <button class="btn btn-outline-light btn-sm"><fa-icon [icon]="faPhone"></fa-icon></button>
    </div>

    <!-- Chat Box -->
    <div class="card-body p-4 chat-box" style="overflow-y: auto; height: 80vh;">
      <!-- Loop through chat messages -->
      <div *ngFor="let message of messages" [ngClass]="{'text-end': message.isUser}" class="mb-3">
        <div class="d-flex" [ngClass]="{'justify-content-end': message.isUser}">
          <div *ngIf="!message.isUser" class="me-2">
            <div *ngIf="ProfileUrl.trim() !== ''">
              <img [src]="ProfileUrl" alt="Madeline" class="rounded-circle" style="width: 40px; height: 40px;" />
            </div>
            <div class="rounded-circle bg-dark d-flex justify-content-center align-items-center " style="width: 40px; height: 40px;" *ngIf="ProfileUrl.trim() === ''">
              <fa-icon [icon]="faUser" style="color: #d2d5db;"></fa-icon>
            </div>
          </div>
          <div class="p-3 rounded" [ngClass]="{
                'bg-light border': !message.isUser,
                'bg-primary text-white': message.isUser
              }" style="max-width: 80%;">
            <p class="mb-0">{{ message.text }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Box -->
    <div class="card-footer" style="border-radius: 0 0 12px 12px;">
      <form [formGroup]="chatForm" (ngSubmit)="sendMessage()">
        <div class="input-group">
          <input formControlName="newMessage" type="text" class="form-control" placeholder="Type a message"
            [ngClass]="{ 'is-invalid': chatForm.get('newMessage')?.invalid && chatForm.get('newMessage')?.touched }"
            style="border-radius: 50px 0 0 50px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);" />
          <button class="btn btn-primary" type="submit" [disabled]="chatForm.invalid"
            style="border-radius: 0 50px 50px 0;">
            Send
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
