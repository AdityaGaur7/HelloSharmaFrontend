<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <!-- Brand/Logo -->
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="assets/logo.png" alt="Logo" class="nav-logo me-2">
      <span class="brand-text">AstroGuru</span>
    </a>

    <!-- Mobile Toggle Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <!-- Navigation Links -->
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/chatastro" routerLinkActive="active">
            <i class="fas fa-phone-alt me-1"></i>Connect with Astrologer
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/bookpooja" routerLinkActive="active">
            <i class="fas fa-pray me-1"></i>Book a Pooja
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/astromall" routerLinkActive="active">
            <i class="fas fa-store me-1"></i>AstroMall
          </a>
        </li>
        <!-- Admin Link - Only shown for admin users -->
        <li class="nav-item" *ngIf="jwtService.isAdmin()">
          <a class="nav-link" routerLink="/admin" routerLinkActive="active">
            <i class="fas fa-lock me-1"></i>Admin Panel
          </a>
        </li>
      </ul>

      <!-- Right Side Items -->
      <div class="nav-right d-flex align-items-center gap-3">
        <!-- Language Dropdown -->
        <div class="dropdown">
          <button class="btn btn-link nav-icon-btn" type="button" id="languageDropdown" data-bs-toggle="dropdown"
            aria-expanded="false">
            <fa-icon [icon]="faGlobe"></fa-icon>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
            <li><a class="dropdown-item" href="#"><i class="fas fa-check me-2 text-success"></i>English</a></li>
            <li><a class="dropdown-item" href="#">हिंदी</a></li>
          </ul>
        </div>

        <!-- Auth Buttons -->
        <div class="auth-buttons" *ngIf="!authService.isAuthenticated()">
          <a routerLink="/signup" class="btn btn-outline-primary btn-sm me-2">Sign Up</a>
          <a routerLink="/login" class="btn btn-primary btn-sm">Login</a>
        </div>

        <!-- User Dropdown -->
        <div class="dropdown" *ngIf="authService.isAuthenticated()">
          <button class="btn btn-link nav-icon-btn" type="button" id="userDropdown" data-bs-toggle="dropdown"
            aria-expanded="false">
            <div class="user-avatar">
              <fa-icon [icon]="faUser"></fa-icon>
            </div>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li class="dropdown-header">
              <strong>Welcome Back!</strong>
              <br>
              <small class="text-muted">{{ jwtService.decodeToken()?.sub }}</small>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <!-- Admin Option - Only shown for admin users -->
            <li *ngIf="jwtService.isAdmin()">
              <a class="dropdown-item" routerLink="/admin">
                <i class="fas fa-lock me-2"></i>Admin Panel
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/profile">
                <i class="fas fa-user-circle me-2"></i>My Profile
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/orders">
                <i class="fas fa-history me-2"></i>Order History
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/wallet">
                <i class="fas fa-wallet me-2"></i>Wallet
              </a>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <a class="dropdown-item text-danger" href="#" (click)="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
