<app-nav></app-nav>
<div class="container py-4">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div class="profile-image-container mb-3">
                        <img [src]="userProfile.profileImage" alt="Profile" class="profile-image">
                        <button class="btn btn-sm btn-light edit-photo">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                    <h5 class="mb-1">{{ userProfile.name }}</h5>
                    <p class="text-muted mb-3">{{ userProfile.location }}</p>
                    <div class="d-grid">
                        <button class="btn btn-outline-primary">
                            <i class="fas fa-edit me-2"></i>Edit Profile
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title mb-4">Profile Information</h5>
                    <form (ngSubmit)="onSubmit()">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" [(ngModel)]="userProfile.name" name="name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" [(ngModel)]="userProfile.email" name="email">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" [(ngModel)]="userProfile.phone" name="phone">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" [(ngModel)]="userProfile.dob" name="dob">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" [(ngModel)]="userProfile.location"
                                    name="location">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
