<app-nav></app-nav>
<div class="container py-4">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Available Balance</h6>
                    <h2 class="mb-3">₹{{ balance }}</h2>
                    <button class="btn btn-primary w-100">
                        <i class="fas fa-plus me-2"></i>Add Money
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title mb-4">Recent Transactions</h5>
                    <div class="transaction-list">
                        <div class="transaction-item" *ngFor="let transaction of transactions">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="mb-1">{{ transaction.description }}</h6>
                                    <small class="text-muted">{{ transaction.date | date:'medium' }}</small>
                                </div>
                                <div
                                    [ngClass]="{'text-success': transaction.type === 'Credit', 'text-danger': transaction.type === 'Debit'}">
                                    {{ transaction.type === 'Credit' ? '+' : '-' }}₹{{ transaction.amount }}
                                </div>
                            </div>
                            <hr>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
